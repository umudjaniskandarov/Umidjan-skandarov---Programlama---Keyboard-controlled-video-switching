<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dual Sync Video Switch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<button id="startBtn">▶ Başlat</button>

<div id="wrap">
  <video id="videoA" src="video1.mp4"></video>
  <video id="videoB" src="video2.mp4"></video>
</div>


<div id="infoBox">
  <div id="statusText">Kamera A Aktif</div>
  <div id="keyText">Geçiş: A / B</div>
</div>

<script>
const A = document.getElementById("videoA");
const B = document.getElementById("videoB");
const statusText = document.getElementById("statusText");
const startBtn = document.getElementById("startBtn");

let running = false;
let active = "A";

async function startPlayback(){
  try{
    await Promise.all([A.play(), B.play()]);
    A.muted = false;
    B.muted = true;
    running = true;
    startBtn.style.display = "none";
  }catch(err){
    alert("Video başlatılamadı. Dosya yolunu ve tarayıcı izinlerini kontrol et.");
    console.error(err);
  }
}

startBtn.addEventListener("click", startPlayback);

function setActive(cam){
  active = cam;

  
  B.currentTime = A.currentTime;

  if(cam === "A"){
    A.style.opacity = 1;
    B.style.opacity = 0;
    A.muted = false;
    B.muted = true;
    statusText.textContent = "Kamera A Aktif";
  }else{
    A.style.opacity = 0;
    B.style.opacity = 1;
    A.muted = true;
    B.muted = false;
    statusText.textContent = "Kamera B Aktif";
  }
}

document.addEventListener("keydown",(e)=>{
  if(!running) return;

  const key = e.key.toLowerCase();
  if(key === "a" && active !== "A") setActive("A");
  if(key === "b" && active !== "B") setActive("B");
});
</script>

</body>
</html>
